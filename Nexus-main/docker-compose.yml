services:
  postgres:
    image: postgres:16
    container_name: nexus-postgres
    environment:
      POSTGRES_DB: agencia_viajes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - nexus_pgdata:/var/lib/postgresql/data
      - ./BDD/postgresql.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agencia_viajes"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexus_pgdata:
